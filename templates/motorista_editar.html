{% extends 'base_admin.html' %}
{% from '_macros.html' import csrf %}
{% set pagina = 'motoristas' %}
{% block titulo %}Editar motorista{% endblock %}

{% block conteudo %}
<div class="row justify-content-center">
<div class="col-md-8 col-lg-5 col-xl-4">
    <div class="card shadow border-0">
        <div class="card-header"><i class="fa-solid fa-pen me-2"></i>Editar motorista</div>
        <div class="card-body p-4">
            <form method="post">
                {{ csrf() }}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">NOME COMPLETO</label>
                    <input type="text" name="nome" class="form-control" required maxlength="100" value="{{ motorista.nome }}">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">CPF</label>
                    <input type="text" name="cpf" class="form-control" inputmode="numeric" maxlength="14" required value="{{ motorista.cpf|cpf }}">
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-secondary">GABINETE / SETOR</label>
                    <select name="gabinete_id" class="form-select" required>
                        {% for g in gabinetes %}
                        <option value="{{ g.id }}" {{ 'selected' if g.id == motorista.gabinete_id }}>{{ g.rotulo }}{{ ' (inativo)' if not g.ativo }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold text-secondary">VALIDADE DA CNH</label>
                    <input type="date" name="validade_cnh" class="form-control" required value="{{ motorista.validade_cnh.strftime('%Y-%m-%d') if motorista.validade_cnh else '' }}">
                    <div class="form-text">Atualize aqui quando a CNH for renovada.</div>
                </div>
                <div class="d-flex gap-2">
                    <a href="{{ url_for('gestao_motoristas') }}" class="btn btn-light flex-fill">Cancelar</a>
                    <button class="btn btn-primary flex-fill">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
</div>
{% endblock %}
