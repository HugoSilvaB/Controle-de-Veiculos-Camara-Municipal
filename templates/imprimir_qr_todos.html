<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Codes da frota</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; padding: 20px; color: #111; }
        .acoes { text-align: center; margin-bottom: 20px; }
        button { padding: 10px 22px; font-size: 15px; cursor: pointer; }
        .grade { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .etiqueta { border: 2px solid #0b2a4a; border-radius: 12px; padding: 16px; text-align: center; break-inside: avoid; page-break-inside: avoid; }
        .etiqueta img.brasao { height: 44px; }
        .etiqueta .t { font-size: 12px; font-weight: bold; margin: 4px 0 8px; }
        .qr { width: 190px; height: 190px; }
        .modelo { font-size: 17px; font-weight: bold; margin-top: 6px; }
        .placa { display: inline-block; margin-top: 4px; padding: 2px 12px; border: 2px solid #111; border-radius: 5px; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        @media print { .acoes { display: none; } body { padding: 0; } }
    </style>
</head>
<body>
    <div class="acoes"><button onclick="window.print()">🖨 Imprimir todos</button></div>
    <div class="grade">
    {% for item in itens %}
        <div class="etiqueta">
            <img class="brasao" src="{{ url_for('static', filename='images/brasao.png') }}" alt="Brasão">
            <div class="t">CÂMARA MUNICIPAL DE NOVO GAMA · FROTA</div>
            {% if qr_local %}
                <img class="qr" src="{{ url_for('qr_png', id=item.veiculo.id) }}" alt="QR Code">
            {% else %}
                <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data={{ item.url|urlencode }}" alt="QR Code">
            {% endif %}
            <div class="modelo">{{ item.veiculo.modelo }}</div>
            <div class="placa">{{ item.veiculo.placa }}</div>
        </div>
    {% else %}
        <p>Nenhum veículo ativo.</p>
    {% endfor %}
    </div>
</body>
</html>
