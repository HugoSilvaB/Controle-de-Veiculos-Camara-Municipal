{% extends 'base_publico.html' %}
{% block titulo %}Viagem iniciada{% endblock %}
{% block conteudo %}
<div class="card shadow-lg border-0 text-center">
    <div class="card-body p-4 p-md-5">
        <div class="icone-sucesso mb-3"><i class="fa-solid fa-circle-check"></i></div>
        <h1 class="h4 fw-bold">Viagem iniciada!</h1>
        <p class="text-muted mb-3">{{ veiculo.modelo }} · <strong>{{ veiculo.placa }}</strong></p>
        <div class="alert alert-info small border-0 text-start">
            Ao voltar, <strong>escaneie o mesmo QR Code</strong> para informar o KM final e encerrar a viagem.
        </div>
        <p class="small text-muted mb-0">Boa viagem e dirija com segurança.</p>
    </div>
</div>
{% endblock %}
