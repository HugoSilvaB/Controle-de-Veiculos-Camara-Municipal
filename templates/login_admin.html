{% extends 'base_publico.html' %}
{% from '_macros.html' import csrf %}
{% block titulo %}Acesso do gestor{% endblock %}
{% block conteudo %}
<div class="card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='images/brasao.png') }}" alt="Brasão" class="brasao-card mb-3">
            <h1 class="h4 fw-bold mb-0">Acesso do gestor</h1>
            <small class="text-muted">Controle de Frota</small>
        </div>
        <form method="post" autocomplete="on">
            {{ csrf() }}
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary">USUÁRIO</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" name="usuario" class="form-control" required autofocus autocomplete="username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary">SENHA</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" name="senha" class="form-control" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
